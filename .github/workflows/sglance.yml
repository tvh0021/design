name: sglance CI

on:
  push:
    paths:
      - 'cli/sglance/**'
      - '.github/workflows/sglance.yml'
  pull_request:
    paths:
      - 'cli/sglance/**'
      - '.github/workflows/sglance.yml'

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.11'
          - '3.13'
    defaults:
      run:
        working-directory: cli/sglance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .

      - name: Run privacy leak check
        env:
          SGLANCE_LEAK_DENYLIST: ${{ secrets.SGLANCE_LEAK_DENYLIST }}
        run: |
          if [ -z "${SGLANCE_LEAK_DENYLIST//[[:space:]]/}" ]; then
            echo "::notice::SGLANCE_LEAK_DENYLIST secret is empty; skipping leak check."
            exit 0
          fi
          umask 077
          trap 'rm -f .leak-denylist' EXIT
          printf '%s\n' "$SGLANCE_LEAK_DENYLIST" > .leak-denylist
          python3 scripts/leak_check.py --require-denylist
