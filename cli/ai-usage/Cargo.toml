[package]
name = "ai-usage"
version = "0.1.0"
edition = "2024"
description = "Show current usage limits for Claude, Codex, Antigravity, ChatLLM and Zed"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }
