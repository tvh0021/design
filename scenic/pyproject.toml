[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenic"
version = "0.1.0"
description = "Scenic route planner for New York State (OSM road graph and routing)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmium>=4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scenic = "scenic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
