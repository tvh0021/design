[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scenic"
version = "0.1.0"
description = "Scenic route planner for New York State (OSM road graph, routing and scenery score)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "osmium>=4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyarrow>=15",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "shapely>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
scenic = "scenic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"scenic.web" = ["static/*", "static/vendor/*/*", "static/vendor/*/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
