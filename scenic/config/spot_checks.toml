# Spot checks for the scenery score (docs/SCORE_SPEC.md section 6). Each
# stretch: road by `ref` (matched against every ;-separated ref of an edge,
# spaces and hyphens ignored) or `name`, plus a lon/lat box
# [lon_min, lat_min, lon_max, lat_max] spanning the two named towns. An edge
# matches when its middle vertex is inside the box. Result = length-weighted
# mean S of the matched edges. These are checks only, never inputs.

[thresholds]
scenic = 0.70   # expected S >= this
dull = 0.35     # expected S <= this
need = 8        # of 10, per list

# v0.2 checks (docs/SCORE_V02.md section 1). The v0.1 checks above are still
# reported for comparison. Dull items carry `kind`: "urban" (default),
# "motorway" (reported only) or "flat" (rural band).
[v3]
scenic_min = 0.65
scenic_need = 8
urban_max = 0.20
urban_need = 6            # of the 7 urban strips
flat_band = [0.20, 0.50]  # all flat rural roads (here and in [holdout])

[v4]
landscape = ["Adirondack Trail", "Central Adirondack Trail", "Southern Adirondack Trail",
             "Roosevelt-Marcy Trail", "High Peaks Byway (Route 73)", "Olympic Trail",
             "Catskill Mountains", "Mountain Cloves", "Durham Valley Scenic Byway",
             "Upper Delaware Scenic Byway", "Shawangunk Mountains", "Cayuga Lake", "Seneca Lake",
             "Scenic Route 90", "Dude Ranch Trail", "Lakes to Locks Passage"]
landscape_median_min = 0.65
neighbour_radius_m = 15000.0
rural_dev_max = 0.3
neighbours_need = 18      # of 25 designated byways

