# V2: each scenic stretch (the [[scenic]] list and [[holdout2.scenic]])
# against the fastest route between its two ends.
[v2]
max_shared = 0.20         # fast alternative shares < 20 % of its length with the stretch
min_gap = 0.25            # S_stretch - S0 >= this
ratio = 1.3               # and S_stretch > 1 - (1 - S0) / ratio
need_share = 0.80         # of non-trivial pairs

# V5: hand-named moments and non-moments. Only the first seven moments and
# three non-moments are named in SCORE_V02; the rest were added for this
# check before moments were inspected near them. Each point was placed on
# the named road with OSM data (road ref or name, a bridge way or the
# nearest point to the named water), never with detected moments.
[v5]
radius_m = 300.0
moments_need = 27         # of 30 within radius_m of a detected moment
non_moments_max = 2       # of 15

