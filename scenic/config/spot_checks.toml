# Spot checks for the scenery score (docs/SCORE_SPEC.md section 6). Each
# stretch: road by `ref` (matched against every ;-separated ref of an edge,
# spaces and hyphens ignored) or `name`, plus a lon/lat box
# [lon_min, lat_min, lon_max, lat_max] spanning the two named towns. An edge
# matches when its middle vertex is inside the box. Result = length-weighted
# mean S of the matched edges. These are checks only, never inputs.

[thresholds]
scenic = 0.70   # expected S >= this
dull = 0.35     # expected S <= this
need = 8        # of 10, per list

