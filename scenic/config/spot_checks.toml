# Routing checks (docs/SCORE_V02.md section 1: V1, V2, V5), run by the
# validate_routes stage. Points are [lon, lat].
[v1]
need = 6                  # of 8 pairs
best_budget = 1.30        # the best route under +30 % ...
min_scenic_minutes = 8.0  # ... has at least this many scenic minutes
min_new_road_km = 2.0     # a road counts as on a route with at least this many km
bands = [[1.05, 1.20], [1.20, 1.30], [1.30, 1.50]]

