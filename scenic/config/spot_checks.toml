# Holdout-2 (docs/SCORE_V02.md section 1), written before the first v0.2 line
# of code. Scenic stretches from the unscored pool there plus one road named
# nowhere else in the repo; urban strips and flat-rural roads likewise; OD
# pairs for the corridor test (V1, not built yet). Nothing is computed on this
# set until the v0.2 run is declared final: validation skips it while
# declared_final is false. Looking early retires the set.

[holdout2]
declared_final = true
routes_sealed = false      # unsealed 2026-11-02 after the route search was final; V1 on the OD pairs, V2 on the scenic stretches
urban_max = 0.20          # V3: urban strips S <= this, need 4 of 5
flat_band = [0.20, 0.50]  # V3: flat rural, all three inside the band
scenic_min = 0.65         # V3: scenic S >= this, need 8 of 10

